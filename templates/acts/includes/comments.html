<section class="detail-section act-comments-section">
    <div class="act-collaboration-section__header"><h2>Комментарии</h2><span class="act-collaboration-section__hint">Обсуждение акта</span></div>
    {% if can_contribute %}
    <form class="comment-form" method="post" action="{% url 'acts:add_comment' act.pk %}">
        {% csrf_token %}
        {{ comment_form.non_field_errors }}
        <div class="comment-form__field">
            {{ comment_form.text }}
            {{ comment_form.text.errors }}
        </div>
        <button class="link-button" type="submit"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"/></svg>Добавить комментарий</button>
    </form>
    {% endif %}

    <div data-live-act-comments>
        {% include 'acts/includes/comments_list.html' %}
    </div>
</section>
