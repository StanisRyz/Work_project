{% comment %}
One agenda question, as one numbered line. The visible number comes from CSS
counters, so adding or removing a row never has to renumber anything in the
markup. One row high, growing with the text (`autogrow.js`).
{% endcomment %}
<div class="protocol-line protocol-agenda-row" data-row>
    <span class="protocol-line__number" aria-hidden="true"></span>
    <label>
        <span class="visually-hidden-label">Вопрос повестки</span>
        <textarea name="agenda-{{ row.index }}-text" rows="1" placeholder="Сформулируйте вопрос">{{ row.text }}</textarea>
        {% if row.errors.text %}<span class="field-error">{{ row.errors.text }}</span>{% endif %}
    </label>
    <button class="protocol-remove-button" type="button" data-remove-row aria-label="Удалить вопрос" title="Удалить вопрос">×</button>
</div>
