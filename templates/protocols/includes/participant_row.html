{% comment %}
One editable participant. The author is not rendered from here — the author row
is fixed and lives directly in the editor.
{% endcomment %}
<div class="protocol-row protocol-row--participant" data-row data-employee-pair>
    <label>
        <span>Подразделение</span>
        <select name="participants-{{ row.index }}-department" data-department-select required>
            <option value="">Выберите подразделение</option>
            {% include 'protocols/includes/department_options.html' with selected=row.department %}
        </select>
        {% if row.errors.department %}<span class="field-error">{{ row.errors.department }}</span>{% endif %}
    </label>
    <label>
        <span>Сотрудник</span>
        <select name="participants-{{ row.index }}-user" data-employee-select data-participant-user required>
            <option value="">Выберите сотрудника</option>
            {% include 'protocols/includes/employee_options.html' with selected=row.user %}
        </select>
        {% if row.errors.user %}<span class="field-error">{{ row.errors.user }}</span>{% endif %}
    </label>
    <label class="protocol-checkbox">
        <input type="checkbox" name="participants-{{ row.index }}-requires_approval"{% if row.requires_approval %} checked{% endif %}>
        <span>Требует согласования</span>
        {% comment %}
        Shown by `protocol_editor.js` when this employee is also an assignee of
        a protocol task. It never touches the checkbox: the manual flag is the
        author's own choice and is stored independently of the automatic rule.
        {% endcomment %}
        <span class="protocol-auto-approval-hint" data-auto-approval-hint hidden>Согласует как исполнитель задачи</span>
    </label>
    <button class="protocol-remove-button" type="button" data-remove-row aria-label="Удалить участника" title="Удалить участника">×</button>
</div>
