name: Database compatibility

# Checks that the project runs correctly on both supported database backends:
# the default SQLite (local development) and PostgreSQL (see
# docs/deployment.md). This workflow does not deploy anything and
# does not migrate existing data; the PostgreSQL service below is a disposable
# CI-only container.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test --verbosity 2

  postgresql:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quality_ecosystem_ci
          POSTGRES_USER: quality_ci
          POSTGRES_PASSWORD: ci_only_demo_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality_ci -d quality_ecosystem_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only values for a disposable service container. Not production
      # secrets, not a real server address, not a real organizational account.
      DATABASE_ENGINE: postgresql
      DB_NAME: quality_ecosystem_ci
      DB_USER: quality_ci
      DB_PASSWORD: ci_only_demo_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_CONN_MAX_AGE: '0'
      DB_CONN_HEALTH_CHECKS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm PostgreSQL backend is active
        run: |
          python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "ecosystem.settings")
          import django

          django.setup()
          from django.db import connection

          connection.ensure_connection()
          if connection.vendor != "postgresql":
              raise SystemExit(
                  f'Expected the postgresql backend but connection.vendor is "{connection.vendor}".'
              )
          print(f'Confirmed PostgreSQL backend (vendor="{connection.vendor}").')
          PY

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Show migration state
        run: python manage.py showmigrations

      - name: Run test suite
        run: python manage.py test --verbosity 2
